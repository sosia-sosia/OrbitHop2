<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>オービット・ホップ2</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0d1020;--ink:#f2efe6;--dim:#9aa0bd;--acc:#ffb74a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#05060d;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;display:block;box-shadow:0 0 40px rgba(0,0,0,.6)}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;pointer-events:none}
#score{font-size:56px;font-weight:900;line-height:1}
#best{font-size:13px;color:var(--dim)}
#ov{box-sizing:border-box;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(13,16,32,.72);text-align:center;padding:24px}
#ov h1{margin:0;font-size:38px;font-weight:900;letter-spacing:.04em}
#ov p{margin:0;color:var(--dim);font-size:15px;line-height:1.7;max-width:300px}
#go,#startbtn{font:inherit;font-size:20px;font-weight:900;background:var(--acc);color:#2a1a00;border:0;border-radius:40px;padding:14px 44px}
#barw{width:200px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:8px auto 4px;overflow:hidden}#bar{height:100%;width:100%;background:#ffb74a}
#combo{height:18px;color:#ffe066;font-weight:900;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:320px;width:100%}
.st{font:inherit;font-size:22px;font-weight:900;border:0;border-radius:14px;padding:10px 0;background:#242a52;color:var(--ink)}
.st small{display:block;font-size:11px;color:var(--acc)}.st.lock{opacity:.4}
.st.bn{background:rgba(255,183,74,.14);box-shadow:inset 0 0 0 1.5px rgba(255,183,74,.75);color:#ffd27a}.st.bn small{color:#ffe066}
#menu,#snd,#colbtn,#dexbtn,#slotbtn{font:inherit;font-size:15px;background:none;color:var(--dim);border:1px solid var(--dim);border-radius:30px;padding:8px 26px}
.scr{box-sizing:border-box;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#logo{background:#0d1020}
#lgt{font-size:40px;font-weight:900;letter-spacing:.12em}
#tap{position:absolute;bottom:16%;color:var(--dim);font-size:14px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
#title{justify-content:center;gap:calc(var(--u,8px)*5);overflow-y:auto;background:rgba(13,16,32,.55);padding:calc(var(--u,8px)*4) 24px}
#title>div{flex:0 1 auto;min-height:0}
#startbtn{flex:0 0 auto}
#title h1{margin:0 0 10px;font-size:40px;font-weight:900;letter-spacing:.04em}
#title p{margin:0;color:var(--dim)}
#collect{justify-content:flex-start;align-items:stretch;text-align:left;gap:10px;background:#080a18;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px}
#chead{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#cback{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#242a52;border:0;border-radius:24px;padding:10px 16px;min-height:44px}
#ctitle{flex:1;text-align:center;font-size:19px;font-weight:900}
#ccount{font-size:13px;font-weight:900;color:var(--acc);white-space:nowrap}
#clist{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;padding-bottom:12px}
.csh{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--dim);margin-top:6px}
.cc{background:#1b2040;border:1px solid transparent;border-radius:14px;padding:8px 4px;text-align:center;min-width:0}
.cc.on{border-color:rgba(255,183,74,.55)}
.cc canvas{position:static;display:block;box-shadow:none;width:100%;max-width:84px;aspect-ratio:1;margin:0 auto}
.cn{font-size:13px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:10px;color:var(--dim)}.cs.ok{color:var(--acc)}
#dex,#slots,#admin,#bonus,#binfo{justify-content:flex-start;align-items:stretch;text-align:left;gap:10px;background:#080a18;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px}
#dhead,#dhead2,#ahead,#bhead,#bihead{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#dback,#sback,#aback,#bback,#biback{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#242a52;border:0;border-radius:24px;padding:10px 16px;min-height:44px}
#dtitle,#stitle,#atitle,#btitle,#bititle{flex:1;text-align:center;font-size:19px;font-weight:900}
#dhead2::after,#ahead::after,#bhead::after,#bihead::after{content:"";width:84px}
#dcount{font-size:13px;font-weight:900;color:var(--acc);white-space:nowrap}
#dlist,#slist{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.dc{display:flex;gap:12px;align-items:center;background:#1b2040;border:1px solid transparent;border-radius:14px;padding:10px 12px}
.dc.on{border-color:rgba(255,183,74,.55)}
.dc canvas{position:static;box-shadow:none;width:56px;height:56px;flex:0 0 56px;display:block}
.dn{font-size:15px;font-weight:900}.dd{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.55}
.sc{background:#1b2040;border:1px solid transparent;border-radius:16px;padding:14px}
.sc.on{border-color:rgba(255,183,74,.55)}
.sh{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:18px}
.sh small{font-size:11px;font-weight:400;color:var(--dim)}
.ss{font-size:13px;margin-top:8px;line-height:1.75}.ss b{color:var(--acc)}
.sb{display:flex;gap:8px;margin-top:12px}
.sb button{font:inherit;font-size:15px;font-weight:900;border-radius:24px;min-height:44px;border:0}
.sp{flex:1;background:var(--acc);color:#2a1a00}.sx{background:none;color:var(--dim);border:1px solid var(--dim)!important;padding:0 16px}.sd{background:#c0344b;color:#fff;padding:0 18px}
.sq{flex:1;align-self:center;font-size:13px}
#lockbtn{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;padding:0;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--dim);display:flex;align-items:center;justify-content:center}
#apwv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#apwv p{margin:0;color:var(--dim)}
#apw{width:180px;font:inherit;font-size:24px;text-align:center;letter-spacing:.4em;color:var(--ink);background:#1b2040;border:1px solid #3a4170;border-radius:14px;padding:12px;-webkit-user-select:text;user-select:text;touch-action:auto}
#aerr{height:18px;color:#ff7b8a;font-size:13px}
#aok{font:inherit;font-size:18px;font-weight:900;background:var(--acc);color:#2a1a00;border:0;border-radius:40px;padding:12px 40px}
#apan{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding-bottom:16px}
.at{display:flex;gap:6px}.at button{flex:1;font:inherit;font-size:15px;font-weight:900;min-height:44px;border-radius:12px;border:1px solid #3a4170;background:#1b2040;color:var(--dim)}
.at button.on{background:var(--acc);color:#2a1a00;border-color:var(--acc)}
.ah{margin:18px 0 8px;font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.ah small{font-weight:400;color:var(--dim);font-size:12px}
.ast{display:flex;align-items:center;justify-content:center;gap:16px;background:#1b2040;border-radius:14px;padding:10px}
.ast button{font:inherit;font-size:22px;font-weight:900;width:52px;height:44px;border-radius:12px;border:0;background:#242a52;color:var(--ink)}
.ast div{min-width:130px;text-align:center;font-size:16px;font-weight:900}.ast b{color:var(--acc);font-size:22px}
.ab{display:flex;gap:8px;margin-bottom:8px}.ab button{flex:1;font:inherit;font-size:13px;min-height:40px;border-radius:20px;border:1px solid var(--dim);background:none;color:var(--dim)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cg.two{grid-template-columns:repeat(2,1fr)}
.ch{font:inherit;font-size:13px;min-height:44px;border-radius:12px;border:1px solid #3a4170;background:#1b2040;color:var(--dim);padding:4px 6px}
.ch.on{background:rgba(255,183,74,.18);border-color:var(--acc);color:var(--ink);font-weight:900}
.csh2{grid-column:1/-1;font-size:12px;color:var(--dim);margin-top:4px}
#bonusbtn{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:none;border:1px solid var(--dim);border-radius:30px;padding:8px 22px;line-height:1.35}
#bonusbtn small{display:block;font-size:11px;font-weight:400;color:var(--dim)}
#bonusbtn.new{border-color:var(--acc)}#bonusbtn.new small{color:var(--acc);font-weight:900}
#bbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#bcap{font-size:16px;font-weight:900}
#bcount{font-size:46px;font-weight:900;color:var(--acc);line-height:1}#bcount small{font-size:16px;color:var(--ink);font-weight:700}
#bstat{font-size:14px;color:var(--dim)}
#bclaim{font:inherit;font-size:18px;font-weight:900;background:var(--acc);color:#2a1a00;border:0;border-radius:40px;padding:14px 34px;min-height:48px}
#bclaim:disabled{background:#3a4170;color:var(--dim)}
#bmsg{min-height:20px;color:#8fe3ff;font-size:14px;font-weight:900}
#bnote{font-size:12px;color:var(--dim);max-width:290px;margin:4px 0 0;line-height:1.6}
#rsbtn{font:inherit;font-size:15px;font-weight:900;background:#7dd3fc;color:#04202e;border:0;border-radius:40px;padding:14px 16px;margin-bottom:10px;max-width:92%}
#rsbtn:disabled{background:#3a4170;color:var(--dim)}
#bibody{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-bottom:14px}
.bil{font-size:14px;margin:6px 0 4px}.bil b{color:var(--acc)}
.bir{display:flex;align-items:center;gap:10px;background:#1b2040;border:1px solid transparent;border-radius:12px;padding:8px 12px;text-align:left;margin-top:4px}
.bir.ok{border-color:rgba(255,183,74,.55)}.bir canvas{position:static;box-shadow:none;width:44px;height:44px;flex:0 0 44px;display:block}
.bir>div:nth-child(2){flex:1}.bn1{font-size:12px;color:var(--dim)}.bn2{font-size:16px;font-weight:900}.bst{font-size:12px;color:var(--dim);white-space:nowrap}.bir.ok .bst{color:var(--acc)}
#biplay{font:inherit;font-size:18px;font-weight:900;background:var(--acc);color:#2a1a00;border:0;border-radius:40px;padding:14px 40px;margin-top:14px}
.rkb,.rwb{width:100%;max-width:300px;margin:12px auto 0}.rkt{font-size:12px;color:var(--dim);margin-bottom:2px}
.rk,.rw{display:flex;align-items:baseline;gap:8px;background:#1b2040;border:1px solid transparent;border-radius:10px;padding:6px 12px;margin-top:4px;font-size:14px;text-align:left}
.rk b,.rw b{flex:1;margin-left:6px}.rk small,.rw small{color:var(--dim);font-size:11px}
.rk.hi{border-color:var(--acc)}.rk.hi small,.rw small.nw{color:var(--acc);font-weight:900}.rw.ok b{color:#8fe3ff}
#ov small{display:block;margin-top:8px;color:var(--dim);font-size:11px}
#congrats{background:rgba(8,10,24,.95);overflow:hidden;z-index:5}
#cgbody{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:320px}
#cgbody p{margin:0;font-size:15px;line-height:1.7}.cgt{font-size:30px;font-weight:900;color:var(--acc)}
#cgbody canvas{position:static;box-shadow:none;width:170px;height:170px;display:block}
#cgok{font:inherit;font-size:18px;font-weight:900;background:var(--acc);color:#2a1a00;border:0;border-radius:40px;padding:14px 44px;margin-top:6px}
.cf{position:absolute;top:-20px;width:8px;height:14px;opacity:.9;animation:cf 3s linear infinite}
@keyframes cf{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hide"><div id="score"></div><div id="combo"></div></div>
<div id="logo" class="scr"><img id="lg" src="Glogo.png" alt="" style="visibility:hidden;width:100%;max-height:50%;object-fit:contain" onload="this.style.visibility='visible'" onerror="this.remove();document.getElementById('lgt').classList.remove('hide')"><div id="lgt" class="hide">ORBIT HOP</div><div id="tap" class="hide">タップして進む</div></div>
<div id="title" class="scr hide"><button id="lockbtn" aria-label="管理者"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg></button><div style="width:100%"><img id="ti" src="Gtitle.png" alt="" style="visibility:hidden;width:100%;max-height:calc(var(--u,8px)*40);object-fit:contain;display:block" onload="this.style.visibility='visible'" onerror="this.remove();document.getElementById('tit').classList.remove('hide')"><div id="tit" class="hide"><h1>オービット・ホップ2</h1><p>惑星をわたって、ゴールをめざせ</p></div></div><button id="startbtn">スタート</button></div>
<div id="ov">
  <h1 id="t"></h1>
  <p id="d"></p>
  <div id="grid" class="hide"></div>
  <button id="rsbtn" class="hide"></button>
  <button id="go" class="hide"></button>
  <button id="menu" class="hide">ステージ選択</button>
  <button id="colbtn" class="hide">なかまずかん</button>
  <button id="dexbtn" class="hide">わくせいずかん</button>
  <button id="bonusbtn" class="hide"></button>
  <button id="slotbtn" class="hide">データ選択</button>
  <button id="snd" class="hide">♪ BGM ON</button>
</div>
<div id="collect" class="scr hide"><div id="chead"><button id="cback">‹ もどる</button><div id="ctitle">なかまずかん</div><div id="ccount"></div></div><div id="clist"></div></div>
<div id="dex" class="scr hide"><div id="dhead"><button id="dback">‹ もどる</button><div id="dtitle">わくせいずかん</div><div id="dcount"></div></div><div id="dlist"></div></div>
<div id="slots" class="scr hide"><div id="dhead2"><button id="sback">‹ もどる</button><div id="stitle">セーブデータを選ぶ</div></div><div id="slist"></div></div>
<div id="admin" class="scr hide">
  <div id="ahead"><button id="aback">‹ もどる</button><div id="atitle">管理者</div></div>
  <div id="apwv"><p>パスワードを入力してください</p><input id="apw" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12"><div id="aerr"></div><button id="aok">ひらく</button></div>
  <div id="apan" class="hide"></div>
</div>
<div id="bonus" class="scr hide"><div id="bhead"><button id="bback">‹ もどる</button><div id="btitle">ログインボーナス</div></div>
  <div id="bbody"><svg viewBox="0 0 64 40" width="96" height="60" fill="none" stroke="#ffb74a" stroke-width="2.5" stroke-linejoin="round"><path d="M6 6h52v9a5 5 0 0 0 0 10v9H6v-9a5 5 0 0 0 0-10z" fill="rgba(255,183,74,.12)"/><path d="M42 8v24" stroke-dasharray="3 4"/><path d="M22 14l3 6 6 1-4.5 4 1.3 6-5.8-3.3L16.2 31l1.3-6-4.5-4 6-1z" fill="#ffb74a" stroke="none" transform="translate(-3 -2) scale(.9)"/></svg><div id="bcap">再スタートチケット</div><div id="bcount"></div><div id="bstat"></div><button id="bclaim"></button><div id="bmsg"></div><p id="bnote">ゲームオーバーのとき、セーブポイントの惑星からやり直せます（1回につき1枚つかいます）。</p></div></div>
<div id="binfo" class="scr hide"><div id="bihead"><button id="biback">‹ もどる</button><div id="bititle">ボーナスステージ</div></div><div id="bibody"></div></div>
<div id="congrats" class="scr hide"><div id="cgbody"></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){
  // 論理サイズ(W×H)を固定し、見える範囲＝難易度がウィンドウサイズで変わらないようにする
  const iw=innerWidth,ih=innerHeight;let s=1;
  dpr=window.devicePixelRatio||1;
  if(iw<=430){W=iw;H=Math.min(ih,Math.round(iw*2.4))}   // スマホ: 従来どおり(極端に縦長のときだけ制限)
  else{W=400;H=Math.round(W*2.17);s=Math.min(iw/W,ih/H)}  // PC: スマホ縦長画面と同じ比率で固定し、全体を拡縮
  const bw=W*s,bh=H*s,l=Math.round((iw-bw)/2),t=Math.round((ih-bh)/2);
  cv.width=Math.round(bw*dpr);cv.height=Math.round(bh*dpr);ctx.setTransform(dpr*s,0,0,dpr*s,0,0);
  cv.style.width=bw+'px';cv.style.height=bh+'px';cv.style.left=l+'px';cv.style.top=t+'px';
  document.documentElement.style.setProperty('--u',(H/100)+'px');
  for(const id of['ov','hud','logo','title','collect','dex','slots','admin','bonus','binfo','congrats']){const e=document.getElementById(id);
    e.style.left=l+'px';e.style.top=t+'px';e.style.right='auto';e.style.bottom='auto';
    e.style.width=W+'px';e.style.transformOrigin='0 0';e.style.transform=s===1?'':'scale('+s+')';
    if(id!=='hud')e.style.height=H+'px'}}
addEventListener('resize',resize);resize();

/* ============================================================
   続編：ルート／ステージデータ
   ステージは「legs（区間）」の並びで作る。1区間 = 進行方向 d と 惑星の数 n。
     d : 'up' | 'down' | 'left' | 'right'（その区間の自動スクロール方向）
     n : その区間の惑星数（最後の区間の最後の惑星がゴール）
   区間が切り替わるところが「方向転換位置」。カメラはルートに沿った軌道を時間どおりに進み、曲がり角は円弧で向きを変える。
   画面の動きはプレイヤーの動きには左右されない（前作と同じ自動スクロール）。
   新しい区間は必ず、直前の区間とは別のレーン（別の位置）に作られる（逆走させない）。
   ステージのその他の項目（すべて省略可）
     start     : 最初の惑星のワールド座標 {x,y}（既定 {0,0}）
     seed      : 惑星配置の乱数の種
     speed     : スクロール速度の倍率（既定1）
     zoom      : 表示倍率（既定は難易度から自動）
     lane      : ジグザグの振れ幅（既定は難易度から自動）
     startFrac : 開始惑星を「後ろ側の画面端」から何割の位置に置くか
     corner    : 曲がり角でカメラが描く円弧の半径（既定 280）
     place     : 特別な惑星の指定 {惑星番号:'save'|'ultra'}（乱数は消費しないので、他の惑星の配置は変わらない）
   形の追加は ROUTE に関数を足すだけ（legs の配列を返せばよい）。
   ============================================================ */
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const OPP={up:'down',down:'up',left:'right',right:'left'};
const ARW={up:'↑',down:'↓',left:'←',right:'→'};
const ROUTE={
  line:(d,n)=>[{d,n}],                                                    // 直線
  U:(d,n1,m,n2,t)=>[{d,n:n1},{d:t,n:m},{d:OPP[d],n:n2}],                 // U字：進む→横へ→逆向きに進む
  Z:(d,n1,m,n2,t)=>[{d,n:n1},{d:t,n:m},{d,n:n2}],                         // Z字：進む→横へずれる→同じ向きに進む
  S:(d,n1,m1,n2,m2,n3,t)=>[{d,n:n1},{d:t,n:m1},{d:OPP[d],n:n2},{d:t,n:m2},{d,n:n3}] // S字：U字を2回つなぐ
};
const STAGES=[
  {name:'直線・上',legs:ROUTE.line('up',8),place:{6:'save'}},

/* ---- 画面座標・判定（スクロール方向に応じて前/後ろの端を入れ替える） ---- */
function scr(x,y){return{x:(x-camX)*Z,y:(y-camY)*Z}}

// （進行方向 t は軸に沿っているとき従来と同じ判定。曲がり角の円弧の間は連続的に切り替わる）
function landableAt(x,y,cx,cy,t){
  const sx=(x-cx)*Z,sy=(y-cy)*Z,m5=5*Z,ax=Math.abs(t.x),ay=Math.abs(t.y);
  const mt=10*Math.max(0,-t.y)+m5*(1-ay)-1e4*Math.max(0,t.y),mb=10*Math.max(0,t.y)+m5*(1-ay)-1e4*Math.max(0,-t.y);
  const ml=10*Math.max(0,-t.x)+m5*(1-ax)-1e4*Math.max(0,t.x),mr=10*Math.max(0,t.x)+m5*(1-ax)-1e4*Math.max(0,-t.x);
  return sy>mt&&sy<H-mb&&sx>ml&&sx<W-mr;

function landable(q){return landableAt(q.x,q.y,camX,camY,tan)}

function outsideAt(sx,sy,t){const ax=Math.abs(t.x),ay=Math.abs(t.y),xm=30*Z;
  const top=30*Math.max(0,-t.y)+60*Math.max(0,t.y)+xm*(1-ay),bot=30*Math.max(0,t.y)+60*Math.max(0,-t.y)+xm*(1-ay);
  const lef=30*Math.max(0,-t.x)+60*Math.max(0,t.x)+xm*(1-ax),rig=30*Math.max(0,t.x)+60*Math.max(0,-t.x)+xm*(1-ax);
  return sy<-top||sy>H+bot||sx<-lef||sx>W+rig}
function outside(s){return outsideAt(s.x,s.y,tan)}
// 後ろ側の画面端（進行方向の反対側）から8px内側より後ろへ出たら「取り残された」
function behindWhy(s,t){t=t||tan;const k=.5;   // 軸に沿って進む間は後ろ端だけ。曲がり角の円弧の間は旧い向き・新しい向き両方の後ろ端を見る

  if(t.x<-k&&s.x>W-8)return TRAIL_MSG.left;if(t.x>k&&s.x<8)return TRAIL_MSG.right;return null}
function behind(s){return behindWhy(s)!==null}
/* ---- 流れ星：進行方向の前の端から、こちらへ向かって飛んでくる ---- */
function spawnMeteor(){

  if(a.y!==0){x=camX+W/(2*Z)+(Math.random()-.5)*(W/Z-80);y=a.y<0?camY:camY+H/Z}
  else{y=camY+H/(2*Z)+(Math.random()-.5)*(H/Z-80);x=a.x<0?camX:camX+W/Z}

function pinMeteor(m){const a=scrollDir;if(a.y<0)m.y=camY+10/Z;else if(a.y>0)m.y=camY+H/Z-10/Z;else if(a.x>0)m.x=camX+W/Z-10/Z;else m.x=camX+10/Z}

/* ---- カメラ：区間ごとの「定位置」を計算し、方向転換時はそこへ滑らかに移動 ---- */
// 区間Lのレーン中心が画面の横(縦)中央、惑星qが後ろ側の端から startFrac の位置になるカメラ左上座標
function frame(L,q){
  const f=L.f;
  if(L.a.y!==0)return{x:L.c.x*L.lc-W/(2*Z),y:L.a.y<0?q.y-(1-f)*H/Z:q.y-f*H/Z};
  return{x:L.a.x>0?q.x-f*W/Z:q.x-(1-f)*W/Z,y:L.c.y*L.lc-H/(2*Z)};

/* ---- カメラの軌道 ----
   各区間のレーン中心を結んだ経路（曲がり角は円弧）をステージ開始時に1本作り、カメラは最初のジャンプのあと
   その上を一定の速さで時間どおりに進む。プレイヤーの着地・位置・タイミングには一切左右されない。 */
const CORNER_R=280;      // 曲がり角でカメラが描く円弧の半径（ステージデータの corner で変更可）
function buildCam(S){
  const n=legs.length,X=legs.map(L=>L.a.y!==0?L.c.x*L.lc-W/(2*Z):L.c.y*L.lc-H/(2*Z));   // 各区間の「横方向」カメラ座標（レーン中心が画面中央）
  const f0=frame(legs[0],pl[0]),V=[{x:f0.x,y:f0.y}];                                       // 頂点: 開始位置 + 各曲がり角
  for(let m=1;m<n;m++)V.push(legs[m-1].a.y!==0?{x:X[m-1],y:X[m]}:{x:X[m],y:X[m-1]});
  const len=[];for(let m=1;m<n;m++){const a=legs[m-1].a;len[m]=(V[m].x-V[m-1].x)*a.x+(V[m].y-V[m-1].y)*a.y}
  const R=S.corner||CORNER_R,rho=[];
  for(let m=1;m<n;m++)rho[m]=Math.max(20,Math.min(R,.45*len[m],m<n-1?.45*len[m+1]:1e9));  // 短い区間では円弧を小さくする
  const sp=L=>baseV*(L.horiz?HSPD:1),pcs=[],lineOf=[];let px=V[0].x,py=V[0].y,u=0;
  for(let j=0;j<n;j++){
    const a=legs[j].a,last=j===n-1;let ex=0,ey=0,l=1e6;
    if(!last){const r=rho[j+1];ex=V[j+1].x-a.x*r;ey=V[j+1].y-a.y*r;l=Math.max(0,(ex-px)*a.x+(ey-py)*a.y)}
    lineOf[j]=pcs.length;pcs.push({k:'line',leg:j,x:px,y:py,ax:a.x,ay:a.y,len:l,u0:u,v0:sp(legs[j]),v1:sp(legs[j])});u+=l;
    if(!last){const b=legs[j+1].a,r=rho[j+1],al=Math.PI*r/2;
      pcs.push({k:'arc',leg:j,x:ex+b.x*r,y:ey+b.y*r,ax:a.x,ay:a.y,bx:b.x,by:b.y,r,len:al,u0:u,v0:sp(legs[j]),v1:sp(legs[j+1])});u+=al;
      px=V[j+1].x+b.x*r;py=V[j+1].y+b.y*r}
  }

}
// 経路上の位置 u(進んだ距離)でのカメラ左上座標・進行方向(接線)・区間番号・速さ
function camAt(u){
  const pcs=camPath.pcs;if(u<0)u=0;let k=0;
  while(k<pcs.length-1&&u>=pcs[k].u0+pcs[k].len)k++;
  const c=pcs[k],d=u-c.u0;
  if(c.k==='line')return{x:c.x+c.ax*d,y:c.y+c.ay*d,tx:c.ax,ty:c.ay,k,leg:c.leg,v:c.v0};
  const th=d/c.r,cs=Math.cos(th),sn=Math.sin(th);
  return{x:c.x+(-c.bx*cs+c.ax*sn)*c.r,y:c.y+(-c.by*cs+c.ay*sn)*c.r,tx:c.bx*sn+c.ax*cs,ty:c.by*sn+c.ay*cs,k,leg:th<Math.PI/4?c.leg:c.leg+1,v:c.v0+(c.v1-c.v0)*th/(Math.PI/2)};
}
function camSetU(u){
  camU=u;const c=camAt(u);camX=tgX=c.x;camY=tgY=c.y;tan={x:c.tx,y:c.ty};
  scrollDir=Math.abs(c.tx)>Math.abs(c.ty)?(c.tx>0?DIRS.right:DIRS.left):(c.ty>0?DIRS.down:DIRS.up);
  camLeg=curLeg=c.leg;scrollV=curSv=c.v;
  const done=camPath.pcs[c.k].leg;                                       // カメラが完全に次の区間へ入った区間の惑星は「通過済み」（カメラの進み具合で決まる）
  if(done!==passedLeg){passedLeg=done;for(const q of pl)q.passed=q.leg<done}
  return c;
}
function camAdvance(dt){
  const v=camAt(camU).v;camSetU(camU+v*dt);
  const c=camAt(camU);
  if(c.k!==lastPiece){lastPiece=c.k;const p=camPath.pcs[c.k];if(p.k==='arc')turnToast={t:'方向転換！ '+ARW[legs[p.leg+1].d],life:2.4}}   // 曲がり角に入ったら知らせる
  if(turnToast){turnToast.life-=dt;if(turnToast.life<=0)turnToast=null}
}
// 惑星 k が画面の定位置に来るときのカメラ位置(u)。再スタート用
function uForPlanet(k){
  const q=pl[k],j=Math.min(q.leg,legs.length-1),f=frame(legs[j],q),c=camPath.pcs[camPath.lineOf[j]];
  return c.u0+Math.max(0,Math.min(c.len,(f.x-c.x)*c.ax+(f.y-c.y)*c.ay));

function drawTurnToast(){

/* ---- ルート生成 ---- */
function genRoute(S,i,sx,jit,rp){
  const st=S.start||{x:0,y:0};
  pl=[{type:'normal',bx:st.x,by:st.y,x:st.x,y:st.y,amp:0,ph:0,r:24,h:35,leg:0,cx:0,cy:0}];items=[];legs=[];
  let lp=pl[0],idx=0;
  S.legs.forEach((def,j)=>{
    const a=DIRS[def.d],c={x:-a.y,y:a.x},pa=j?DIRS[S.legs[j-1].d]:null;
    const sd=j?(c.x*pa.x+c.y*pa.y>0?1:-1):1;               // レーン中心を、直前の区間の先側へ置く＝別の位置に新ルート
    const lc=lp.x*c.x+lp.y*c.y+sd*(sx+(j?TURN_GAP:0));
    const L={d:def.d,a,c,lc,n:def.n,horiz:a.y===0,f:def.f||S.startFrac||FRAC[def.d]};legs.push(L);
    const Vc=a.y!==0?W/Z:H/Z;
    for(let h=1;h<=def.n;h++){
      idx++;const p0=pl[idx-1],side=h%2?sd:-sd;
      const ty=pick(i),amp=ty==='mover'?rnd(30,55):0;
      const cross=Math.max(lc-Vc/2+50+amp,Math.min(lc+Vc/2-50-amp,lc+side*sx+rnd(-jit,jit)));
      const along=p0.x*a.x+p0.y*a.y+rnd(120,170);
      const x=a.x*along+c.x*cross,y=a.y*along+c.y*cross;
      pl.push({type:ty,bx:x,by:y,x,y,amp,ph:rnd(0,6),leg:j,cx:c.x,cy:c.y,r:(ty==='small'?rnd(10,13):rnd(16,28))*(ty==='normal2'?1.5:ty==='normal3'?2:1),h:TY[ty].h===undefined?rnd(0,360):TY[ty].h});
      if(rng()<rp){const t=rnd(.4,.6),j2=rnd(-30,30),ix=p0.x+(x-p0.x)*t+c.x*j2,iy=p0.y+(y-p0.y)*t+c.y*j2;
        items.push({t:'r',bx:ix,by:iy,x:ix,y:iy,r:rnd(24,36),amp:i>=3&&rng()<.4?rnd(30,60):0,ph:rnd(0,6),cx:c.x,cy:c.y})}
      lp=pl[idx];
    }
  });
  if(S.place)for(const k in S.place){const idx=+k,q=pl[idx],ty=S.place[k];   // 特別な惑星（ゴール/スタートは対象外）
    if(!q||idx<1||idx>=pl.length-1||!TY[ty])continue;
    q.type=ty;q.amp=0;q.x=q.bx;q.y=q.by;q.h=TY[ty].h;q.r=Math.max(20,Math.min(34,q.r))}
}
function segX(p,q,r,t){const o=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);return o(p,q,r)*o(p,q,t)<0&&o(r,t,p)*o(r,t,q)<0}
// 惑星どうしが重ならない／ルートが自分自身と交差しない（＝通過済みの道を戻らない）ことを確認
function routeOK(){
  for(let a=0;a<pl.length;a++)for(let b=a+1;b<pl.length;b++){
    const p=pl[a],q=pl[b],d=Math.hypot(p.x-q.x,p.y-q.y);
    if(d<p.r+(p.amp||0)+q.r+(q.amp||0)+(b-a===1?50:80))return false;
    if(b-a>=2&&d<200)return false;
  }
  for(let a=0;a<pl.length-1;a++)for(let b=a+2;b<pl.length-1;b++)if(segX(pl[a],pl[a+1],pl[b],pl[b+1]))return false;
  return true;

function prep(i){
  stage=i;const S=STAGES[i-1];
  N=S.legs.reduce((t,l)=>t+l.n,0);par=Math.ceil(N/2);
  const Z0=Math.max(.65,1-(i-1)*.035),hz=S.legs.some(l=>l.d==='left'||l.d==='right');
  Z=S.zoom||(hz?Math.min(Z0,.68):Z0);                                  // 横スクロールを含む面は少し引いて先を見せる
  baseV=(24+4*i)*1.2*(S.speed||1);scrolling=false;meteors=[];spawnT=2.5;
  const sx=S.lane||Math.min(W/Z0/2-85,W/2-25),jit=25+i*3,rp=i<2?0:Math.min(.12*(i-1),.7);
  const base=S.seed||i*104729+57;
  for(let t=0;t<60;t++){seed=base+t*977;genRoute(S,i,sx,jit,rp);if(routeOK())break}   // 重なる配置になったら種をずらして作り直す
  items=items.filter(m=>pl.every(q=>Math.hypot(m.x-q.x,m.y-q.y)>=m.r+(m.amp||0)+q.r+(q.amp||0)+36));
  pl[N].goal=true;pl[N].type='goal';pl[N].amp=0;pl[N].x=pl[N].bx;pl[N].y=pl[N].by;pl[N].r=30;pl[N].h=48;
  cur=0;ang=Math.PI/2;dir=1;orbR=pl[0].r+30;score=0;trail=[];ignore=0;

/* ============================================================
   再スタートチケット／ログインボーナス（セーブデータごとに記録）
   記録先: 選択中のセーブスロット内の tk = {n:所持数, last:最後に受け取った日 'YYYY-MM-DD'}
   ============================================================ */
const Ticket=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const T={now:()=>new Date(),
    today(){const d=T.now();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},
    count(){return Slot.cur?Slot.tk.n:0},
    canClaim(){return !!Slot.cur&&T.today()>Slot.tk.last},               // 日付が進んだときだけ受け取れる（同じ日・日付を戻した場合は不可）
    claim(){if(!T.canClaim())return false;Slot.tk.n+=1;Slot.tk.last=T.today();Slot.save();return true},
    use(){if(!Slot.cur||Slot.tk.n<1)return false;Slot.tk.n-=1;Slot.save();return true}
  };
  return T;
})();
const LoginBonus=(()=>{
  const U={msg:'',
    refresh(){const c=Ticket.canClaim(),n=Ticket.count(),b=$('bonusbtn');b.className=c?'new':'';
      b.innerHTML='ログインボーナス<small>'+(c?'● 今日の分を受け取れます':'✓ 今日は受け取り済み')+'　チケット '+n+'枚</small>';
      $('bcount').innerHTML=n+'<small> 枚</small>';
      $('bstat').textContent=c?'今日の再スタートチケットを受け取れます':'今日の分は受け取り済みです。次は日付が変わってから。';
      $('bclaim').disabled=!c;$('bclaim').textContent=c?'今日の1枚を受け取る':'受け取り済み';$('bmsg').textContent=U.msg},
    open(){U.msg='';U.refresh();$('bonus').classList.remove('hide')},
    close(){$('bonus').classList.add('hide')},
    claim(){if(Ticket.claim()){U.msg='再スタートチケットを1枚獲得しました！';blip(880,.08);setTimeout(()=>blip(1175,.14),90);vib([15,30,15])}else U.msg='今日の分は受け取り済みです';U.refresh()}
  };
  return U;
})();
$('bonusbtn').addEventListener('click',e=>{e.stopPropagation();LoginBonus.open()});
$('bback').addEventListener('click',e=>{e.stopPropagation();LoginBonus.close()});

/* ============================================================
   セーブポイント／再スタート
   再スタート地点は「プレイ中だけの一時記録」。チケットや進行データとは別にメモリ上だけで持ち、保存しない。
   ============================================================ */
const Restart=(()=>{
  const R={point:null,
    clear(){R.point=null},
    onLand(q){if(state!=='play'||q.type!=='save'||cur>=N)return;
      R.point={stage,idx:cur,score,temp:[...Ally.temp]};                  // 最後に着地したセーブポイントで更新（仮救出した仲間も一緒に記録）
      rings.push({x:q.x,y:q.y,r:q.r,life:1});texts.push({t:'セーブ！ ここから再スタートできる',x:q.x,y:q.y-q.r-128,life:2});
      blip(988,.08);setTimeout(()=>blip(1319,.12),80);vib(12)},
    can(){return !!R.point&&R.point.stage===stage&&state==='over'},
    showButton(over){const b=$('rsbtn'),ok=over&&R.can();b.classList.toggle('hide',!ok);
      if(ok){const n=Ticket.count();b.disabled=n<1;b.textContent=n>0?'チケット1枚で再スタート（所持'+n+'枚）':'再スタートチケットなし（所持0枚）'}},
    go(){const p=R.point;if(!R.can()||!Ticket.use())return false;       // チケットが無ければ再スタート不可
      prep(p.stage);                                                       // 同じ配置のステージを作り直し、記録した惑星から再開
      const idx=p.idx;cur=idx;scrolling=false;
      ang=Math.PI/2;dir=1;orbR=pl[idx].r+30;score=p.score;trail=[];ignore=0;
      P={x:pl[idx].x,y:pl[idx].y+orbR,vx:0,vy:0,orbit:true};
      lastPiece=-1;camSetU(uForPlanet(idx));                                 // その惑星が画面の定位置に来る軌道上の位置へカメラを置く
      Ally.temp=new Set(p.temp);                                           // 記録時点までの仮救出を引き継ぐ
      bgmPlay();state='play';$('ov').classList.add('hide');$('rsbtn').classList.add('hide');$('hud').classList.remove('hide');
      blip(660,.1);vib(10);return true}
  };
  return R;
})();
$('rsbtn').addEventListener('click',e=>{e.stopPropagation();Restart.go()});

/* ============================================================
   ボーナスステージ（通常ステージ3・6・9のクリア後に挿入）
   画面固定・惑星6個（四隅4＋中央の左右2）。惑星と惑星の間にだけ出るターゲットに触れて得点を集める。

   ============================================================ */
const BONUS_STAGES={          // キー=ステージ選択で、このステージの次に並ぶボーナス（3なら3と4のあいだ）
  3:{time:30,goal:10,types:['normal','normal2','normal3','slow','boost','normal2']},   // かんたん：ふつう3種＋低速・加速
  6:{time:30,goal:12,types:['normal','normal3','slow','boost','pulse','fast']},        // ふつう  ：変速・高速が登場
  9:{time:30,goal:15,types:['normal2','boost','pulse','fast','ultra','small']}         // むずかしい：超高速・小型が登場
};   // types は惑星の配置順（左上・右上・中央左・中央右・左下・右下）
const BONUS_CFG={
  ready:1.8,                 // 開始前の準備時間(秒)。この間は時間が進まない
  spawnEvery:.8,             // ターゲットの出現間隔(秒)
  maxTargets:3,              // 同時に出る最大数
  planetR:22,
  radius:{normal:22,normal2:30,normal3:38,small:12},   // 惑星の種類ごとの大きさ

  outPenalty:5,              // 場外に出たときの減点
  allyStep:5,                // 仲間の獲得ライン：目標点 / +allyStep点 / +2×allyStep点
  freeRatio:.5,              // ターゲットを「惑星の間以外の空いた場所」に出す割合
  kinds:[{v:1,r:17,life:3.2,w:50,h:200},{v:2,r:20,life:2.8,w:32,h:130},{v:3,r:23,life:2.4,w:18,h:48}],  // 得点・大きさ・消えるまでの秒数・出やすさ・色
  layout:[[.16,.20],[.84,.20],[.22,.52],[.78,.52],[.16,.88],[.84,.88]],   // 0左上 1右上 2中央左 3中央右 4左下 5右下（画面に対する割合）
  edges:[[0,1],[4,5],[0,2],[2,4],[1,3],[3,5],[2,3]],                       // ターゲットが出てよい「惑星と惑星の間」
  startPlanet:2
};
const Bonus=(()=>{
  const B={st:0,cfg:null,t:0,score:0,ready:0,targets:[],spawn:0,win:false,
    start(n){
      Restart.clear();B.st=n;B.cfg=BONUS_STAGES[n];
      Z=1;camX=camY=tgX=tgY=cvx=cvy=0;tan={x:0,y:-1};turnToast=null;
      Ally.active=[];Ally.n=0;Ally.temp=new Set();Ally.fx=[];Ally.toast=null;   // 通常ステージの仲間はボーナスには出さない
      pl=BONUS_CFG.layout.map(([fx,fy],k)=>{const ty=(B.cfg.types&&B.cfg.types[k])||'normal',R=BONUS_CFG.radius[ty]||BONUS_CFG.planetR,h=TY[ty]&&TY[ty].h!==undefined?TY[ty].h:BONUS_CFG.hues[k%BONUS_CFG.hues.length];
        return{type:ty,x:W*fx,y:H*fy,bx:W*fx,by:H*fy,r:R,h,amp:0,ph:k*1.3,cx:0,cy:0,leg:0}});
      items=[];meteors=[];rings=[];parts=[];texts=[];trail=[];shake=0;
      cur=BONUS_CFG.startPlanet;ang=Math.PI/2;dir=1;orbR=pl[cur].r+30;P={x:pl[cur].x,y:pl[cur].y+orbR,vx:0,vy:0,orbit:true};ignore=0;
      B.t=B.cfg.time;B.score=0;B.ready=BONUS_CFG.ready;B.targets=[];B.spawn=0;B.win=false;
      state='bonus';bgmPlay();$('ov').classList.add('hide');$('rsbtn').classList.add('hide');$('hud').classList.remove('hide');B.hud()},
    // --- ごほうび（仲間）とランキング ---
    thresholds(goal){const st=BONUS_CFG.allyStep;return[goal,goal+st,goal+2*st]},                     // 獲得ライン：決められた点 / +5点 / +10点
    allies(k){return ALLY_DATA.filter(a=>a.bonus===k).sort((x,y)=>x.tier-y.tier)},
    rank(k){const r=Slot.bonus[k]&&Slot.bonus[k].rank;return Array.isArray(r)?r.filter(e=>e&&isFinite(+e.s)).map(e=>({s:+e.s,t:+e.t||0})).sort((a,b)=>b.s-a.s||a.t-b.t).slice(0,3):[]},
    addRank(k,score){const rec=Slot.bonus[k]=Slot.bonus[k]||{},e={s:score,t:Date.now()},l=B.rank(k).concat([e]).sort((a,b)=>b.s-a.s||a.t-b.t).slice(0,3);rec.rank=l;return l.indexOf(e)},   // 入った順位(0〜2)、圏外なら-1
    fmt(t){const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()},
    rankHtml(k,hi){const l=B.rank(k);let h='<div class="rkb"><div class="rkt">ランキング TOP3（クリアした得点）</div>';
      for(let i=0;i<3;i++){const e=l[i];h+='<div class="rk'+(i===hi?' hi':'')+'"><span>'+(i+1)+'位</span><b>'+(e?e.s+'点':'--')+'</b><small>'+(e?B.fmt(e.t)+(i===hi?'　NEW!':''):'')+'</small></div>'}
      return h+'</div>'},
    // ステージ選択でボーナスのタイルを押したときの画面：目標・ごほうび・ランキング
    info(k){
      const cfg=BONUS_STAGES[k],n=Object.keys(BONUS_STAGES).indexOf(String(k))+1,th=B.thresholds(cfg.goal),al=B.allies(k),P=$('bibody');
      $('bititle').textContent='ボーナスステージ '+n;P.innerHTML='';
      const E=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};
      P.appendChild(E('div','bil','目標 <b>'+cfg.goal+'点</b> ／ '+cfg.time+'秒　場外に出ると −'+BONUS_CFG.outPenalty+'点'));

      al.forEach((a,i)=>{const own=!!Ally.rescued[a.id],row=E('div','bir'+(own?' ok':'')),c=document.createElement('canvas');c.width=c.height=88;Ally.paint(c,a,own);row.appendChild(c);
        row.appendChild(E('div','','<div class="bn1">'+th[i]+'点 でゲット</div><div class="bn2">'+(own?a.name:'？？？？')+'</div>'));row.appendChild(E('div','bst',own?'✓ 獲得済み':'未獲得'));rb.appendChild(row)});
      P.appendChild(rb);P.appendChild(E('div','','')).innerHTML=B.rankHtml(k,-1);

      $('binfo').classList.remove('hide');P.scrollTop=0},
    hud(){$('score').textContent='ボーナス';$('combo').textContent='のこり '+Math.max(0,Math.ceil(B.t))+'秒　得点 '+B.score+' / 目標 '+B.cfg.goal+'点'},
    // ターゲットを「惑星と惑星の間」(edges) の線分上にだけ出す。惑星の周回軌道とは重ならない位置に限る
    trySpawn(){
      let x=Math.random()*100,K=BONUS_CFG.kinds[0];for(const k of BONUS_CFG.kinds){if(x<k.w){K=k;break}x-=k.w}
      const free=Math.random()<BONUS_CFG.freeRatio;                       // 半分ほどは惑星の間以外（空いた場所）に出す
      for(let tr=0;tr<30;tr++){
        let tx,ty,kind;
        if(free){tx=34+Math.random()*(W-68);ty=130+Math.random()*(H-130-34);kind='free';
          if(pl.some(q=>Math.hypot(q.x-tx,q.y-ty)<q.r+30+K.r+8))continue}     // 惑星の周回軌道には重ねない
        else{const e=BONUS_CFG.edges[Math.floor(Math.random()*BONUS_CFG.edges.length)],a=pl[e[0]],b=pl[e[1]],L=Math.hypot(b.x-a.x,b.y-a.y);
          const m=Math.max(a.r,b.r)+30+K.r+8,lo=m/L,hi=1-m/L;if(lo>=hi)continue;
          const u=lo+Math.random()*(hi-lo);tx=a.x+(b.x-a.x)*u;ty=a.y+(b.y-a.y)*u;kind='edge'}
        if(B.targets.some(o=>Math.hypot(o.x-tx,o.y-ty)<o.r+K.r+10))continue;
        B.targets.push({x:tx,y:ty,v:K.v,r:K.r,h:K.h,life:K.life,max:K.life,done:false,kind});return true}
      return false},
    update(dt){
      clock+=dt;
      for(const r of rings){r.life-=dt*1.8;r.r+=dt*140}rings=rings.filter(r=>r.life>0);
      for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.6}parts=parts.filter(p=>p.life>0);
      for(const t of texts){t.life-=dt;t.y-=dt*20}texts=texts.filter(t=>t.life>0);
      if(shake>0)shake-=dt;
      if(state!=='bonus')return;
      const c=pl[cur];
      if(P.orbit){ang+=dir*omega()*spd(c)*dt;orbR+=((c.r+30)-orbR)*Math.min(1,dt*10);P.x=c.x+Math.cos(ang)*orbR;P.y=c.y+Math.sin(ang)*orbR}   // 惑星の種類ごとの回転速度が効く
      else{
        P.x+=P.vx*dt;P.y+=P.vy*dt;ignore-=dt;
        for(let i=0;i<pl.length;i++){if(i===cur&&ignore>0)continue;const q=pl[i],dx=P.x-q.x,dy=P.y-q.y,d=Math.hypot(dx,dy);
          if(d<zone(q)){cur=i;ang=Math.atan2(dy,dx);dir=(dx*P.vy-dy*P.vx)>0?1:-1;orbR=d;P.orbit=true;rings.push({x:q.x,y:q.y,r:q.r,life:1});blip(440+i*30,.05);Dex.touch(q);break}}
        if(!P.orbit&&(P.x<-12||P.x>W+12||P.y<-12||P.y>H+12)){     // 場外へ出たら減点して、直前の惑星に戻る（準備中は減点なし）

        if(!g.done&&Math.hypot(P.x-g.x,P.y-g.y)<g.r+11){g.done=true;B.score+=g.v;            // 触れたら得点。消えるので同じターゲットでは二重に得点できない
          for(let k=0;k<14;k++){const an=Math.random()*6.28,sp=60+Math.random()*120;parts.push({x:g.x,y:g.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,life:1,h:g.h})}

    },
    end(){

      const pv=Slot.bonus[B.st]||{},g=B.cfg.goal;Slot.bonus[B.st]=Object.assign({},pv,{best:Math.max(+pv.best||0,B.score),clear:!!(pv.clear||B.win)});   // ボーナスの記録（通常ステージのprogには触れない）

      Slot.save();

        +'<div class="rwb"><div class="rkt">仲間のごほうび</div>'+al.map((a,i)=>{const own=!!Ally.rescued[a.id],now=got.indexOf(a)>=0;
          return '<div class="rw'+(own?' ok':'')+'"><span>'+th[i]+'点</span><b>'+(own?a.name:'？？？')+'</b><small'+(now?' class="nw"':'')+'>'+(now?'NEW! 仲間になった':own?'獲得済み':'')+'</small></div>'}).join('')+'</div>'

      $('grid').classList.add('hide');$('colbtn').classList.add('hide');$('dexbtn').classList.add('hide');$('slotbtn').classList.add('hide');$('bonusbtn').classList.add('hide');$('rsbtn').classList.add('hide');
      $('go').classList.remove('hide');$('menu').classList.remove('hide');$('ov').classList.remove('hide');$('hud').classList.add('hide');
      if(B.win)playSE('SE_gole.mp3',()=>blip(784,.2));else blip(200,.25);vib(B.win?[20,40,20]:50)},
    drawWorld(){

function update(dt){
  if(state==='bonus'||state==='bonusend'){Bonus.update(dt);return}
  clock+=dt;
  for(const q of pl)if(q.amp){const o=Math.sin(clock*.9+q.ph)*q.amp;q.x=q.bx+q.cx*o;q.y=q.by+q.cy*o}

    camAdvance(dt);spawnT-=dt;   // カメラはルートの軌道に沿って時間で進む（プレイヤーの動きには関係しない）
    if(stage>=2&&spawnT<=0){
      spawnT=Math.max(1.8,5-.3*stage)*(.7+Math.random()*.6);

    }
    for(const m of meteors){
      if(m.w>0){m.w-=dt;pinMeteor(m);if(m.aim){const t=Math.max(.3,(P.y-m.y)/m.vy);m.vx=Math.max(-220,Math.min(220,(P.x-m.x)/t))}}

    }

  }
  if(state==='play'){
    for(const q of pl){
      if(q.type==='ghost'&&q.hold==='dark'&&Math.hypot(P.x-q.x,P.y-q.y)>=zone(q))q.hold=null;
      if(q.type==='bomb'&&q.t!=null&&!q.gone){q.t-=dt;if(q.t<=0){explode(q);if(P.orbit&&pl[cur]===q){finish(false,'爆発に巻き込まれた');break}}}
    }
    if(P.orbit){
      ang+=dir*omega()*spd(c)*dt;
      orbR+=((c.r+30)-orbR)*Math.min(1,dt*10);
      P.x=c.x+Math.cos(ang)*orbR;P.y=c.y+Math.sin(ang)*orbR;
    }else{
      {const [ax,ay]=acc(P.x,P.y);P.vx+=ax*dt;P.vy+=ay*dt}
      P.x+=P.vx*dt;P.y+=P.vy*dt;ignore-=dt;
      for(let i=0;i<pl.length;i++){if(i===cur&&ignore>0)continue;
        const q=pl[i],dx=P.x-q.x,dy=P.y-q.y,d=Math.hypot(dx,dy);

        if(d<zone(q)&&landable(q)){

          {const va=Math.atan2(P.vy,P.vx),df=va-relAng,bend=Math.abs(Math.atan2(Math.sin(df),Math.cos(df)));celebrate(q,Math.max(0,i-cur-1),bend)}
          cur=i;ang=Math.atan2(dy,dx);
          dir=(dx*P.vy-dy*P.vx)>0?1:-1;if(q.type==='reverse')dir=-dir;
          orbR=d;P.orbit=true;

          Dex.touch(q);
          Restart.onLand(q);
          if(cur===N)finish(true);
          break;
        }
      }
      if(state==='play'&&!P.orbit&&outside(scr(P.x,P.y)))finish(false,'宇宙の果てへ飛んでいった');
    }
    if(state==='play'){trail.push({x:P.x,y:P.y});if(trail.length>26)trail.shift();{const o=scr(P.x,P.y);   // 後ろ側の端から8px内側より後ろへ出たら「取り残された」
      const why=behindWhy(o);
      if(why)finish(false,why);else if(!P.orbit)for(const m of items)if(Math.hypot(P.x-m.x,P.y-m.y)<m.r+6){finish(false,'隕石に衝突');break}}}
  }
  for(const r of rings){r.life-=dt*1.8;r.r+=dt*140}rings=rings.filter(r=>r.life>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.6}parts=parts.filter(p=>p.life>0);
  for(const t of texts){t.life-=dt;t.y-=dt*20}texts=texts.filter(t=>t.life>0);

  if(shake>0)shake-=dt;
}
